<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Veda/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1B4082" />

    <!-- PWA / iOS -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VEDA" />
    <link rel="apple-touch-icon" href="/Veda/icon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Primary SEO -->
    <title>VEDA — Vital Education & Data Archive</title>
    <meta name="description" content="A connected knowledge platform for engineering, science, and competitive exam preparation." />
    <meta name="keywords" content="GATE, engineering, thermodynamics, fluid mechanics, mathematics, competitive exam, VEDA, Dhurta" />
    <link rel="canonical" href="https://prashantkeshr.github.io/Veda/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://prashantkeshr.github.io/Veda/" />
    <meta property="og:title" content="VEDA — Vital Education & Data Archive" />
    <meta property="og:description" content="A connected knowledge platform for engineering, science, and competitive exam preparation." />
    <meta property="og:image" content="https://prashantkeshr.github.io/Veda/icon.svg" />
    <meta property="og:site_name" content="VEDA by Dhurta.Org" />

    <script>
      // SPA redirect for GitHub Pages
      var redirect = sessionStorage.redirect;
      delete sessionStorage.redirect;
      if (redirect && redirect !== location.href) {
        history.replaceState(null, null, redirect);
      }
      // Apply saved theme before React loads to avoid flash
      (function() {
        var theme = localStorage.getItem('veda-theme') || 'system';
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
